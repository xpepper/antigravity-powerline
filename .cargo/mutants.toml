# cargo-mutants configuration. Survivors listed here were triaged as not
# worth a test; say why next to each one.
exclude_re = [
    # Starts a detached worker. Testing it needs timing-sensitive waits for a
    # process nobody can join.
    'src/github\.rs:.*replace spawn_background_fetch with \(\)',
    # Wall-clock Instant::now() cannot deterministically hit the exact
    # nanosecond deadline boundary.
    'src/github\.rs:.*replace < with <= in output_with_timeout',
    # Equivalent: with no prompt tokens the rate is NaN, and NaN passes no
    # trend comparison, so the Step still gets no trend.
    'src/cache_trend\.rs:.*replace > with >= in hit_rate',
]
