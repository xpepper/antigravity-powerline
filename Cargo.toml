[package]
name = "antigravity-powerline"
version = "0.1.0"
edition = "2024"
description = "A fast, customizable powerline status line for Google Antigravity CLI"
license = "MIT"
repository = "https://github.com/xpepper/antigravity-powerline"
readme = "README.md"
keywords = ["antigravity", "gemini", "statusline", "powerline", "cli"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
